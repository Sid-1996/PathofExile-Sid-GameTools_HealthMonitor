[project]
name = "gametools-health-monitor"
version = "1.3.2"
description = "Path of Exile Sid 輔助工具 — 血量/魔力監控、技能連段、背包自動化"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0" }
dependencies = [
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.4",
    "Pillow>=13.0.0",
    "mss>=10.2.0",
    "keyboard>=0.13.5",
    "PyGetWindow>=0.0.9",
    "pyautogui>=0.9.54",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "pyperclip>=1.11.0",
    "pywin32>=312",
    "windows-capture>=2.0.1",
    "PySide6-Essentials>=6.12.0",
    "PySide6-Fluent-Widgets>=1.11.3",
    "velopack>=1.2.161",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "pyinstaller>=6.22.3",
]

[tool.ruff]
target-version = "py310"
line-length = 200
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# 對齊現有 .flake8 忽略規則，同時補上常見問題檢查
select = ["E", "F", "W", "C90"]
ignore = [
    "E501",   # line too long (由 line-length 控制)
    "F401",   # unused import（主程式結構複雜，暫不強制）
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov --cov-report=term-missing"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.3.2"
version_files = [
    "src/_version.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
